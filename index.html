<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- No frame-ancestors here: a browser ignores it in a meta element, it only works as an
     HTTP header, and GitHub Pages sends no custom headers. It would only log a warning. -->
<!-- connect-src 'self': the doc viewer fetches this site's own .md files; still no external network. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laufbursche Blade-Test</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=25">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=25">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png?v=25">
<link rel="stylesheet" href="styles.css?v=25">
</head>
<body data-build="v25">
<div class="wrap">
  <header>
    <h1>Laufbursche <span data-t="brandSub">Blade-Test</span></h1>
    <div class="head-right">
      <span class="status" id="status" data-state="disconnected">getrennt</span>
      <div class="head-tools">
        <div class="langs" id="langs" role="group">
          <button type="button" data-lang="de" aria-pressed="true">DE</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <div class="card">
    <h2 data-t="s1Title"></h2>
    <p class="hint" data-t="about1"></p>
    <p class="hint" data-t="about2"></p>
    <p class="warn" data-t="about3"></p>
  </div>

  <div class="card">
    <h2 data-t="connTitle"></h2>
    <div class="btns">
      <button class="primary span2" id="btn-conn" data-t="btnConnect"></button>
    </div>
    <div class="row"><span class="mono"><span data-t="lblDevice"></span> <span id="dev-name">-</span></span></div>
    <div class="row"><span class="mono"><span data-t="lblService"></span> <span id="svc-name">-</span></span></div>
    <p class="hint" data-t="connHint"></p>
  </div>

  <div class="card">
    <h2 data-t="profTitle"></h2>
    <p class="hint" data-t="profHint1"></p>
    <pre class="copy" id="prof-out">-</pre>
    <p class="hint" data-t="profHint2"></p>
    <div class="row">
      <button id="btn-prof-copy" data-t="btnProfCopy" disabled></button>
    </div>
  </div>

  <div class="card">
    <h2 data-t="lockTestTitle"></h2>
    <p class="hint" data-t="lockTestIntro"></p>
    <ol class="hint">
      <li data-t="lockStep1"></li>
      <li data-t="lockStep2"></li>
      <li data-t="lockStep3"></li>
      <li data-t="lockStep4"></li>
    </ol>
    <p class="hint" data-t="lockTestNote"></p>
  </div>

  <div class="card">
    <h2 data-t="cruiseTitle"></h2>
    <p class="warn" data-t="cruiseWarn"></p>
    <div class="btns">
      <button class="primary" id="btn-unlock-auto" data-t="btnUnlockAuto" disabled></button>
      <button id="btn-unlock-man" data-t="btnUnlockMan" disabled></button>
      <button id="btn-lock" data-t="btnLockCruise" disabled></button>
    </div>
    <p class="hint" data-t="cruiseNote"></p>
  </div>

  <div class="card">
    <h2 data-t="reqTitle"></h2>
    <p class="hint" data-t="reqHint"></p>
    <div class="btns">
      <button class="primary span2" id="btn-req-info" data-t="btnReqInfo" disabled></button>
    </div>
  </div>

  <div class="card">
    <h2 data-t="invTitle"></h2>
    <p class="hint" data-t="invIntro"></p>
    <pre class="copy" id="inv-out">-</pre>
    <p class="hint" data-t="invNote"></p>
    <div class="row">
      <button id="btn-inv-copy" data-t="btnInvCopy" disabled></button>
    </div>
  </div>

  <div class="card">
    <h2 data-t="probeTitle"></h2>
    <p class="hint" data-t="probeIntro"></p>
    <div class="row">
      <label class="full" for="probe-node" data-t="lblNode"></label>
      <select id="probe-node" disabled></select>
      <button id="btn-probe" data-t="btnProbe" disabled></button>
    </div>
    <div class="row">
      <button id="btn-probe-all" data-t="btnProbeAll" disabled></button>
    </div>
    <p class="warn" data-t="probeWarn"></p>
    <p class="hint" data-t="probeNote"></p>
    <pre class="copy" id="probe-out">-</pre>
    <div class="row">
      <button id="btn-probe-copy" data-t="btnProbeCopy" disabled></button>
    </div>
  </div>

  <div class="card">
    <h2 data-t="finTitle"></h2>
    <div class="row">
      <label class="full" for="fin-in" data-t="lblNewFin"></label>
      <input id="fin-in" type="text" maxlength="16" spellcheck="false" autocapitalize="characters" data-t-ph="finPhIdle" placeholder="erst verbinden" disabled>
      <button id="btn-set" data-t="btnWrite" disabled></button>
    </div>
    <div class="row">
      <button id="btn-restore" data-t="btnRestore" disabled></button>
    </div>
    <p class="hint" data-t="finHint1"></p>
    <p class="hint" id="orig-line"><span data-t="finRemembered"></span> <span class="mono" id="orig-name">-</span></p>
    <p class="warn" data-t="finWarn"></p>
    <div class="row">
      <button id="btn-forget" data-t="btnForget" disabled></button>
    </div>
    <hr class="sep">
    <p class="danger" data-t="finDanger"></p>
  </div>

  <div class="card">
    <h2 data-t="frameTitle"></h2>
    <p class="hint" data-t="frameHint"></p>
    <pre class="copy" id="frame">-</pre>
  </div>

  <div class="card">
    <h2 data-t="logTitle"></h2>
    <div class="log-opts">
      <label class="log-opt"><span data-t="logPublic"></span><input type="checkbox" id="public-log" checked></label>
      <label class="log-opt"><span data-t="logDiag"></span><input type="checkbox" id="diag-log"></label>
    </div>
    <div class="btns">
      <button type="button" id="btn-copy-log" data-t="btnCopyLog"></button>
      <button type="button" id="btn-clear-log" data-t="btnClearLog"></button>
      <button type="button" id="btn-save-log" class="span2" data-t="btnSaveLog"></button>
    </div>
    <pre id="log"></pre>
    <p class="hint" data-t="logHint"></p>
  </div>

  <footer class="foot">
    <span class="foot-links">
      <a href="#" data-doc="GUIDE" data-t="footGuide"></a>
      <a href="https://github.com/Laufbursche42/tr-blade-test" target="_blank" rel="noopener" data-t="footSource"></a>
      <a href="#" data-doc="README" data-t="footReadme"></a>
      <a href="#" data-doc="DISCLAIMER" data-t="footDisclaimer"></a>
      <a href="#" data-doc="LICENSE" data-t="footLicense"></a>
      <a href="#" data-doc="PRIVACY" data-t="footPrivacy"></a>
      <a href="#" data-doc="TRADEMARKS" data-t="footTrademarks"></a>
    </span>
    <span class="ver" id="build-ver"></span>
    <a class="foot-copy" href="https://laufbursche42.github.io/Laufbursche42/" target="_blank" rel="noopener">Copyright (c) 2026 Laufbursche</a>
  </footer>
</div>

<dialog id="doc" aria-labelledby="doc-title">
  <div class="doc-head">
    <h3 id="doc-title"></h3>
    <button type="button" id="doc-x">&times;</button>
  </div>
  <div class="doc-body" id="doc-body"></div>
  <div class="doc-foot">
    <button type="button" id="doc-close" data-t="docClose"></button>
  </div>
</dialog>

<script src="i18n.js?v=25"></script>
<script src="app.js?v=25"></script>
</body>
</html>
